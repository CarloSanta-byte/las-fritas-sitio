<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Fritas — Panel de cocina y recepción</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="staff-shell">
  <header class="staff-topbar">
    <div class="logo-badge" aria-hidden="true"><span>LF</span></div>
    <h1>Panel de pedidos</h1>
    <span class="reloj" id="reloj">--:--</span>

    <div class="staff-buscador">
      <span class="icono-lupa">🔎</span>
      <input type="text" id="input-buscar-staff" placeholder="Buscar por nombre, teléfono o código de pedido...">
      <button class="btn-limpiar-busqueda oculto" id="btn-limpiar-busqueda-staff" aria-label="Limpiar búsqueda">✕</button>
    </div>

    <div class="staff-filtros-fila">
      <label class="toggle-entregados">
        <input type="checkbox" id="chk-mostrar-entregados">
        Incluir entregados en "Todos"
      </label>
      <span class="contador-activos" id="contador-activos">0 pedidos activos</span>
    </div>
  </header>

  <nav class="tabs-estado" id="tabs-estado" aria-label="Filtrar por estado"></nav>

  <main class="columna-pedidos" id="columna-pedidos"></main>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="staff.js"></script>
</body>
</html>
